<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" width="320" height="480" role="img" aria-labelledby="t d">
<title id="t">Umkreissuche – Tierisch Verliebt</title>
<desc id="d">Radar mit Tierfreunden in deiner Nähe, kostenlos anmelden</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&amp;display=swap');
text{font-family:'Open Sans','Segoe UI',Helvetica,Arial,sans-serif}
.over{font-size:19px;font-weight:700;letter-spacing:5px;fill:#ff9aa2}
.h1{font-size:46px;font-weight:800;fill:#fff;letter-spacing:-.5px}
.km{font-size:16px;font-weight:800;fill:#3a1418}
.cta{font-size:30px;font-weight:800;fill:#fff}
.sweep{transform-box:view-box;transform-origin:320px 500px;animation:spin 4.8s linear infinite}
.blip{transform-box:fill-box;transform-origin:50% 100%;animation:blip 4.8s ease-out infinite}
.ring{fill:none;stroke:#ff7b86;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 4.8s ease-out infinite}
.pulse{fill:none;stroke:#5fd063;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}
.me{transform-box:fill-box;transform-origin:50% 100%;animation:float 3s ease-in-out infinite}
.twinkle{animation:tw 3.5s ease-in-out infinite}
.shine{animation:shine 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{transform:scale(1.13)}18%,100%{transform:scale(1)}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}30%{opacity:0;transform:scale(4)}100%{opacity:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes tw{50%{opacity:.08}}
@keyframes shine{0%,55%{transform:translateX(-160px)}100%{transform:translateX(700px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{opacity:0}}
</style>
<defs>
  <radialGradient id="bg" cx="50%" cy="52%" r="75%">
    <stop offset="0" stop-color="#4a1519"/><stop offset=".55" stop-color="#26090d"/><stop offset="1" stop-color="#120407"/>
  </radialGradient>
  <radialGradient id="glowR" r=".5"><stop offset="0" stop-color="#c02e2e" stop-opacity=".55"/><stop offset="1" stop-color="#c02e2e" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG" r=".5"><stop offset="0" stop-color="#429a45" stop-opacity=".35"/><stop offset="1" stop-color="#429a45" stop-opacity="0"/></radialGradient>
  <radialGradient id="disc" r=".5"><stop offset="0" stop-color="#ff5c6c" stop-opacity=".16"/><stop offset=".8" stop-color="#ff5c6c" stop-opacity=".04"/><stop offset="1" stop-color="#ff5c6c" stop-opacity=".1"/></radialGradient>
  <linearGradient id="sweepCol"><stop offset="0" stop-color="#ff6b78"/><stop offset="1" stop-color="#ff9aa2"/></linearGradient>
