<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">Ein ruhiger Ablauf für das erste Date mit Hund: absprechen, spazieren, Pause machen</title><rect width="960" height="480" rx="28" fill="#f5f0e8"/><path d="M170 215H790" stroke="#d6c4b2" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#cbb6a2" stroke-width="3"><circle cx="180" cy="215" r="72"/><circle cx="480" cy="215" r="72"/><circle cx="780" cy="215" r="72"/></g><g fill="none" stroke="#913b50" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><path d="M146 190H214V229H180L162 245V229H146Z"/><path d="M453 238L470 211 487 222 510 187M495 188H510V204"/><path d="M765 191V239M789 191V239"/></g><g font-family="sans-serif" fill="#594950" text-anchor="middle" font-size="24"><text x="180" y="335">Vorher absprechen</text><text x="480" y="335">Ruhig losgehen</text><text x="780" y="335">Pausen zulassen</text></g><text x="480" y="405" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#74636a">Eine kurze Runde darf schon das ganze Date sein.</text></svg>